[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "data-handling"
version = "0.1.0"
description = "TerraEyes Data Handling & Satellite Image Preprocessing Subsystem"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "pillow>=10.2.0",
    "pyproj>=3.6.1",
    "shapely>=2.0.3"
]

[tool.setuptools.packages.find]
where = ["."]
